<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b6e64">
<meta name="description" content="Turning Point Recovery — daily recovery support: counter, meetings, check-ins, coping tools. Your data stays on your device.">
<title>Turning Point Recovery</title>
<style>
:root{
  --teal:#0b6e64; --teal-dark:#084f48; --teal-soft:#e3f2ef;
  --bg:#faf7f1; --card:#ffffff; --ink:#2b2620; --muted:#6b6259;
  --line:#e7e0d4; --amber:#b45309; --amber-soft:#fdf3e3;
  --red:#b3261e; --radius:14px;
  --shadow:0 1px 3px rgba(43,38,32,.08),0 4px 14px rgba(43,38,32,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.55; font-size:16px;
}
.wrap{max-width:660px;margin:0 auto;padding:0 16px 96px}
/* ---------- header ---------- */
header.top{
  background:var(--teal); color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-top)) ;
  padding-top:calc(14px + env(safe-area-inset-top));
  position:sticky; top:0; z-index:40;
}
.top-inner{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand h1{font-size:19px;margin:0;line-height:1.25}
.brand p{margin:2px 0 0;font-size:12.5px;opacity:.92}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:10px 18px;border-radius:999px;border:2px solid transparent;
  font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2;
}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-dark)}
.btn-outline{background:#fff;color:var(--teal);border-color:var(--teal)}
.btn-outline:hover{background:var(--teal-soft)}
.btn-danger{background:#fff;color:var(--red);border-color:var(--red)}
.btn-ghost{background:transparent;color:var(--teal);padding:10px 12px}
.btn-sm{min-height:40px;padding:8px 14px;font-size:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
a.btn{color:inherit}
.btn-primary,a.btn-primary{color:#fff}
/* language + help buttons in header */
.hdr-actions{display:flex;gap:8px;align-items:center}
.lang-toggle{
  background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.55);
  border-radius:999px;min-height:44px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;
}
.lang-toggle:hover{background:rgba(255,255,255,.28)}
.help-btn{
  background:#fff;color:var(--red);border-radius:999px;min-height:44px;
  padding:8px 16px;font-weight:800;font-size:14px;cursor:pointer;border:none;
  white-space:nowrap;
}
/* ---------- tab bar ---------- */
nav.tabs{
  position:sticky;top:0;z-index:39;background:var(--bg);
  border-bottom:1px solid var(--line);
}
.tabs-inner{max-width:660px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs-inner::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto;background:none;border:none;cursor:pointer;
  padding:12px 14px;min-height:52px;font-size:14.5px;font-weight:700;color:var(--muted);
  border-bottom:3px solid transparent;white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--teal)}
.tab:hover{color:var(--teal)}
/* ---------- cards & type ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin:14px 0;box-shadow:var(--shadow);
}
.card h2{margin:0 0 8px;font-size:20px;line-height:1.3}
.card h3{margin:14px 0 6px;font-size:16.5px}
.eyebrow{
  font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--teal);margin:0 0 6px;
}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.space-between{justify-content:space-between}
.mt{margin-top:14px}.mb{margin-bottom:14px}
/* affirmation */
.affirmation{
  background:linear-gradient(135deg,var(--teal) 0%,#129183 100%);color:#fff;
  border-radius:var(--radius);padding:22px 18px;margin:14px 0;box-shadow:var(--shadow);
}
.affirmation blockquote{margin:8px 0 0;font-size:21px;font-weight:700;line-height:1.4}
/* crisis strip */
.crisis-strip{
  background:#fff;border:2px solid var(--red);border-radius:var(--radius);
  padding:14px 16px;margin:14px 0;
}
.crisis-strip strong{color:var(--red)}
.tel-link{
  display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;margin:4px 6px 4px 0;
  background:var(--red);color:#fff!important;font-weight:800;border-radius:999px;text-decoration:none;font-size:16px;
}
.tel-link.teal{background:var(--teal)}
.tel-link.plain{background:var(--teal-soft);color:var(--teal-dark)!important}
/* milestone chips */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.chip{
  border:2px solid var(--line);background:#fff;border-radius:999px;
  min-height:44px;padding:8px 14px;font-size:14px;font-weight:700;color:var(--muted);
  display:inline-flex;align-items:center;gap:8px;cursor:default;
}
.chip.earned{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-dark);cursor:pointer}
.chip.earned:hover{background:#d3e9e4}
.chip.next{border-style:dashed;border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
/* meetings */
.meet-day{margin:18px 0 6px;font-size:18px}
.meet-day .today-badge{
  background:var(--teal);color:#fff;font-size:12px;font-weight:800;border-radius:999px;
  padding:3px 10px;margin-left:8px;vertical-align:middle;
}
.meet{
  display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin:8px 0;
}
.meet time{font-weight:800;color:var(--teal-dark);white-space:nowrap;min-width:76px;font-size:14.5px}
.meet .m-name{font-weight:700}
.meet .m-desc{color:var(--muted);font-size:13.5px}
/* forms */
label.f{display:block;font-weight:700;margin:12px 0 6px}
input[type="text"],input[type="date"],input[type="tel"],textarea,select{
  width:100%;border:2px solid var(--line);border-radius:10px;padding:12px;
  font-size:16px;font-family:inherit;background:#fff;color:var(--ink);min-height:48px;
}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{
  outline:3px solid var(--teal);outline-offset:2px;
}
input[type="range"]{width:100%;min-height:44px;accent-color:var(--teal)}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{
  flex:1;min-height:52px;border-radius:12px;border:2px solid var(--line);background:#fff;
  font-size:15px;font-weight:700;cursor:pointer;color:var(--muted);padding:10px;
}
.seg button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-dark)}
.prompt-chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.prompt-chips button{
  border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;
  font-size:13.5px;cursor:pointer;min-height:40px;color:var(--teal-dark);font-weight:600;
}
.prompt-chips button:hover{border-color:var(--teal)}
.entry{border-top:1px solid var(--line);padding:12px 0}
.entry:first-of-type{border-top:none}
.entry .e-date{font-size:13px;color:var(--muted);font-weight:700}
/* breathing */
.breath-stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.breath-box{
  width:170px;height:170px;border-radius:24px;background:var(--teal-soft);
  border:3px solid var(--teal);display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:800;color:var(--teal-dark);font-size:18px;padding:16px;
  transition:transform 4s ease-in-out,background-color 1s;
}
.breath-box.in{transform:scale(1.28);background:#cde8e2}
.breath-box.hold{transform:scale(1.28)}
.breath-box.out{transform:scale(1)}
/* dialog */
dialog{
  border:none;border-radius:18px;padding:0;max-width:min(92vw,480px);width:100%;
  box-shadow:0 12px 48px rgba(0,0,0,.25);
}
dialog::backdrop{background:rgba(43,38,32,.55)}
.dlg-body{padding:22px}
.dlg-body h2{margin-top:0}
.dlg-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.share-card-preview{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
/* footer */
footer.site{
  border-top:1px solid var(--line);margin-top:26px;padding:20px 0 40px;color:var(--muted);
}
footer.site .wrap{padding-bottom:0}
/* toast */
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:24px;
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* misc */
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.kv:last-child{border-bottom:none}
.badge{display:inline-block;background:var(--teal-soft);color:var(--teal-dark);font-weight:800;font-size:12.5px;border-radius:999px;padding:4px 12px}
.divider{height:1px;background:var(--line);margin:16px 0}
ul.clean{padding-left:20px;margin:8px 0}
ul.clean li{margin:6px 0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .breath-box{transition:none}
}
@media (min-width:520px){
  .brand h1{font-size:21px}
}
</style>
</head>

function cleanDays(){
  const iso = store.get("cleanDate",null);
  if(!iso) return null;
  const start = new Date(iso+"T12:00:00");

  const ms = now - start;
  if(ms < 0) return 0;
  return Math.floor(ms/86400000);
}

/* ================= COUNTER ================= */
function breakdown(days){
  const y=Math.floor(days/365), r=days%365, m=Math.floor(r/30), d=r%30;
  return {y,m,d};
}
function plural(n,one,many){ return n+" "+(n===1?one:many); }
function breakdownStr(days){
  const b=breakdown(days);
  return [plural(b.y,t().yr1,t().yr),plural(b.m,t().mo1,t().mo),plural(b.d,t().dy1,t().dy)].join(", ");
}
function renderCounter(){
  const days = cleanDays();
  let body="";
  if(days==null){
    body=`
    <section class="card">
      <h2>${esc(t().counter_title)}</h2>
      <label class="f" for="clean-date">${esc(t().clean_date_q)}</label>

      <button class="btn btn-primary btn-block mt" id="set-date">✓ ${esc(t().set_date)}</button>
    </section>`;
  } else {
    const earned = MILESTONES.filter(m=>days>=m.d);
    const next = MILESTONES.find(m=>days<m.d);
    body=`
    <section class="card" style="text-align:center">
      <p class="eyebrow">${esc(t().counter_title)}</p>
      <div style="font-size:56px;font-weight:800;color:var(--teal);line-height:1.1">${days}</div>
      <div class="muted" style="font-weight:700">${esc(t().days_clean)}</div>
      <div class="small muted mt">${esc(breakdownStr(days))}</div>
      <div class="row mt" style="justify-content:center">
        <button class="btn btn-primary" id="share-clean">📤 ${esc(t().share_clean_time)}</button>
        <button class="btn btn-ghost btn-sm" id="reset-date">${esc(t().reset_date)}</button>
      </div>
    </section>
    <div id="money-slot">${moneyCardHTML(days)}</div>
    <section class="card" aria-label="Milestones">
      <p class="eyebrow">${earned.length} ${esc(t().of)} ${MILESTONES.length} ${esc(t().earned)}</p>
      <div class="chips">
        ${MILESTONES.map(m=>{
          const isE = days>=m.d, isN = next && m.d===next.d;
          const label = lang==="es"?m.es:m.en;
          return `<button class="chip${isE?" earned":""}${isN&&!isE?" next":""}" ${isE?`data-ms="${m.d}" aria-label="${esc(t().share_milestone_title)}: ${esc(label)}"`:`disabled aria-disabled="true"`}>
            <span class="dot" aria-hidden="true"></span>${esc(label)}</button>`;
        }).join("")}
      </div>
      ${next?`<p class="muted"><strong>${esc(t().next)}:</strong> ${esc(lang==="es"?next.es:next.en)} — ${esc(t().in_days)} ${next.d-days} ${esc(t().days_word)}</p>`:""}
    </section>`;
  }
  $("#view").innerHTML = body;
  if(days==null){
    $("#set-date").addEventListener("click",()=>{
      const v=$("#clean-date").value;
      if(!v) return;
      store.set("cleanDate",v); renderCounter(); toast(t().saved);
    });
  } else {
    $("#reset-date").addEventListener("click",()=>{
      if(confirm(t().reset_confirm)){ store.del("cleanDate"); renderCounter(); }
    });
    $("#share-clean").addEventListener("click",()=>openShareDialog("clean"));
    bindMoney();
    document.querySelectorAll("[data-ms]").forEach(b=>b.addEventListener("click",()=>{
      const m=MILESTONES.find(x=>x.d===+b.dataset.ms);
      openShareDialog("milestone",m);
    }));
  }
}

/* ---- share cards (canvas) ---- */
function drawCard({kicker,big,sub}){
  const W=1080,H=1350, c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,"#0b6e64"); g.addColorStop(1,"#149a8b");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  // decorative circles
  x.globalAlpha=.12; x.fillStyle="#ffffff";
  x.beginPath(); x.arc(120,180,150,0,7); x.fill();
  x.beginPath(); x.arc(980,1150,210,0,7); x.fill();
  x.globalAlpha=1;
  // white panel
  const px=70,py=300,pw=W-140,ph=H-560;
  x.fillStyle="#ffffff";
  x.beginPath(); x.roundRect(px,py,pw,ph,48); x.fill();
  x.textAlign="center"; x.fillStyle="#0b6e64";
  x.font="800 54px system-ui,sans-serif";
  x.fillText(kicker, W/2, py+120);
  x.fillStyle="#2b2620"; x.font="800 92px system-ui,sans-serif";
  const words=big.split(" "); let lines=[""];
  words.forEach(w=>{ const last=lines[lines.length-1];
    if(x.measureText(last+" "+w).width>pw-140) lines.push(w); else lines[lines.length-1]=(last+" "+w).trim(); });
  lines.forEach((ln,i)=>x.fillText(ln, W/2, py+300+i*110));
  x.fillStyle="#6b6259"; x.font="600 44px system-ui,sans-serif";
  x.fillText(sub, W/2, py+ph-110);
  // footer band
  x.fillStyle="rgba(255,255,255,.92)";
  x.beginPath(); x.roundRect(px,H-200,pw,130,32); x.fill();
  x.fillStyle="#0b6e64"; x.font="800 34px system-ui,sans-serif";
  x.fillText(t().card_footer, W/2, H-122);
  return c;
}
function milestoneCard(m){
  const label = lang==="es"?m.es:m.en;
  const big = lang==="es" ? `${label} de recuperación` : `${label} of recovery`;
  return drawCard({kicker:t().card_congrats, big, sub:t().card_odaat});
}
function cleanTimeCard(days){
  const big = lang==="es" ? `${days} días limpio/a` : `${days} days clean`;
  return drawCard({kicker:t().total_clean_time, big, sub:breakdownStr(days)});
}
function downloadBlob(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(e){} a.remove(); },4000);
}
async function shareCanvas(canvas,{title,text}){
  const blob = await new Promise(r=>canvas.toBlob(r,"image/png"));
  const file = new File([blob],"turning-point.png",{type:"image/png"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title,text});
      toast(t().shared_ok); return true;
    }
    if(navigator.share){ await navigator.share({title,text}); toast(t().shared_ok); return true; }
  }catch(e){ if(e && e.name==="AbortError") return true; /* user cancelled */ }
  downloadBlob(blob,"turning-point.png");
  toast(t().share_failed); return false;
}
let shareCtx=null;
function openShareDialog(kind,m){
  const days=cleanDays()||0;
  const canvas = kind==="clean" ? cleanTimeCard(days) : milestoneCard(m);
  const label = kind==="clean" ? t().share_clean_time : (lang==="es"?m.es:m.en);
  const text = kind==="clean" ? `${t().share_clean_text} ${days} ${t().days_word} — ${breakdownStr(days)}.` : `${t().share_clean_text} ${label}.`;
  shareCtx={canvas,title:label,text};

    <div class="dlg-actions">

      <button class="btn btn-ghost" id="sh-close">${esc(t().close)}</button>
    </div>`;
  $("#share-preview").src = canvas.toDataURL("image/png");
  const dlg=$("#share-dialog"); dlg.showModal();

    canvas.toBlob(b=>{ downloadBlob(b,"turning-point.png"); toast(t().saved_img); },"image/png");
  });
  $("#sh-close").addEventListener("click",()=>dlg.close());
}

  return moneySubstance()==="drugs"

    : (parseInt(store.get("drinksPerDay","0"),10)>0);
}

function bindMoney(){
  if(!$("#m-drinks")) return;
  let selType = store.get("alcoholType","beer");
  let selSub = moneySubstance();
  let priceTouched = false;
  const paintType = ()=>{
    document.querySelectorAll("[data-mtype]").forEach(x=>{
      const on = x.dataset.mtype===selType;
      x.setAttribute("aria-checked", on);
      x.style.borderColor = on ? "var(--teal)" : "";
      x.style.borderWidth = on ? "2.5px" : "";
    });
  };
  const paintSub = ()=>{
    document.querySelectorAll("[data-msub]").forEach(x=>{
      const on = x.dataset.msub===selSub;
      x.setAttribute("aria-checked", on);
      x.style.borderColor = on ? "var(--teal)" : "";
      x.style.borderWidth = on ? "2.5px" : "";
    });
    const af = $("#m-alcohol-fields"), df = $("#m-drugs-fields");
    if(af) af.hidden = selSub!=="alcohol";
    if(df) df.hidden = selSub!=="drugs";
  };
  paintType(); paintSub();
  document.querySelectorAll("[data-msub]").forEach(b=>b.addEventListener("click",()=>{
    selSub = b.dataset.msub; paintSub();
  }));
  document.querySelectorAll("[data-mtype]").forEach(b=>b.addEventListener("click",()=>{
    selType = b.dataset.mtype; paintType();
    if(!priceTouched) $("#m-price").value = defaultDrinkPrice(selType).toFixed(2);
  }));
  $("#m-price").addEventListener("input",()=>{ priceTouched = true; });
  $("#m-save").addEventListener("click",()=>{
    if(selSub==="drugs"){
      const sp = parseFloat($("#m-spend").value);
      if(sp>0){
        store.set("moneySubstance","drugs");
        store.set("spendPerDay",sp.toFixed(2));
        store.set("drugName",$("#m-drug").value.trim());
        toast(t().saved); renderCounter();
      }
    } else {
      const d = parseInt($("#m-drinks").value,10);
      const p = parseFloat($("#m-price").value);
      if(d>0 && p>0){
        store.set("moneySubstance","alcohol");
        store.set("drinksPerDay",d); store.set("alcoholType",selType);
        store.set("pricePerDrink",p.toFixed(2));
        toast(t().saved); renderCounter();
      }
    }
  });
  const eb = $("#money-edit");
  if(eb) eb.addEventListener("click",()=>{ const w=$("#money-edit-wrap"); w.hidden=!w.hidden; });
}

      </div>`).join("") : `<p class="muted small">${esc(t().noSponsors)}</p>`;
    bindDel();
  };
  const bindDel = ()=>{
    document.querySelectorAll("[data-del-sp]").forEach(b=>{
      if(b.dataset.bound) return; b.dataset.bound="1";
      b.addEventListener("click",()=>{
        const l = store.get("sponsors",[]); l.splice(+b.dataset.delSp,1);
        store.set("sponsors",l); refresh();
      });

  bindDel();
  $("#sp-add").addEventListener("click",()=>{

  });
}
